# ─────────────────────────────────────────────────────────────────────────────
# 本地一键 Conda 环境（modelspace）
#
# 用途：本地复现「后端 RAG + 评测脚本」所需的最小依赖。
#   - 与远程 Docker 对齐 Python 3.10；
#   - 排除了 modelscope / mineru（仅 ModelScope 创空间需要，本地用不到，能显著减小安装体积）；
#   - 额外带上 pytest，用于评测阈值门禁测试。
#
# 一键创建（任选其一）：
#   conda env create -f environment.yml
#   # 或使用仓库自带脚本：
#   powershell -File scripts/setup_env.ps1      # Windows
#   bash scripts/setup_env.sh                    # Linux / macOS
#
# 之后：
#   conda activate modelspace
#   python app.py                                # 启动后端（默认 7860）
#   python scripts/eval/run_evaluation.py --chat-url http://localhost:7860/api/chat --run-name b4_full
# ─────────────────────────────────────────────────────────────────────────────
name: modelspace
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # ── Web 框架 ─────────────────────────────────────────────
      - fastapi==0.115.6
      - uvicorn[standard]==0.32.1
      - python-multipart==0.0.18
      # ── RAG / 检索 ───────────────────────────────────────────
      # torch：CPU 版即可（embedding 用 CPU、LLM 走 API，无需 CUDA）。
      # 需 >=2.5：最新 transformers 已要求 torch>=2.5，2.4.0 会触发
      # "Disabling PyTorch ... required but found 2.4.0" 并崩溃。
      - torch>=2.5.0
      - chromadb
      - networkx
      - jieba>=0.42.0
      - rank-bm25>=0.2.2
      - sentence-transformers>=2.2.0
      # ── LLM / HTTP ───────────────────────────────────────────
      - openai>=1.30.0
      - httpx
      - tenacity
      - tqdm
      - python-dotenv
      # ── Zotero / 解析（可选功能）──────────────────────────────
      - pyzotero>=1.5.0
      - cryptography>=42.0.0
      - beautifulsoup4>=4.12.0
      - lxml>=4.9.0
      - soupsieve>=2.5
      - sniffio>=1.3.0
      # ── 评测（阈值门禁测试 + 干净建库 PDF 抽取 + 可视化）───────
      - pytest
      - pypdf
      - matplotlib
